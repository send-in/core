basePath: /api/v1
definitions:
  api_controller.CreateMessageRequest:
    properties:
      company:
        type: string
      message:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      scheduleTime:
        type: string
      templateId:
        type: string
      timezone:
        type: string
    required:
    - name
    - profile
    type: object
  api_controller.CreateTemplateRequest:
    properties:
      label:
        type: string
      value:
        type: string
    required:
    - label
    - value
    type: object
  api_controller.LoginRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  api_controller.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      timezone:
        type: string
      token:
        type: string
      userAgent:
        type: string
    required:
    - email
    - name
    type: object
  api_controller.UpdateAccountRequest:
    properties:
      email:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      timezone:
        type: string
      userAgent:
        type: string
    type: object
  api_controller.UpdateMessageRequest:
    properties:
      company:
        type: string
      message:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      scheduleTime:
        type: string
      templateId:
        type: string
      timezone:
        type: string
    required:
    - name
    - profile
    type: object
  api_controller.UpdateTemplateRequest:
    properties:
      label:
        type: string
      value:
        type: string
    required:
    - label
    - value
    type: object
  core_internal_model.Account:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      timezone:
        type: string
      token:
        type: string
      updatedAt:
        type: string
      userAgent:
        type: string
    type: object
  core_internal_model.Message:
    properties:
      accountID:
        type: string
      company:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isSent:
        type: boolean
      message:
        type: string
      name:
        type: string
      picture:
        type: string
      profile:
        type: string
      scheduleTime:
        type: string
      template:
