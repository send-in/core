      templateID:
        type: string
      timezone:
        type: string
      updatedAt:
        type: string
    type: object
  core_internal_model.Template:
    properties:
      accountID:
        type: string
      createdAt:
        type: string
      id:
        type: string
      label:
        type: string
      updatedAt:
        type: string
      value:
        type: string
    type: object
info:
  contact: {}
  description: LinkedIn outreach automation API
  title: SendIn API
  version: "1.0"
paths:
  /account:
    delete:
      description: Delete the authenticated account and clear session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Delete account
      tags:
      - account
    get:
      description: Returns the authenticated account
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core_internal_model.Account'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get current account
      tags:
      - account
    put:
      consumes:
      - application/json
      description: Update the authenticated account
      parameters:
      - description: Account payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_controller.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
