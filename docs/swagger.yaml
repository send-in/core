            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create account
      tags:
      - auth
  /connections:
    get:
      description: Get all connections belonging to the authenticated account
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - default: recents
        description: recents|a-z|z-a
        in: query
        name: sort
        type: string
      - description: Search by name, company, bio or public id
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: Filter by public ids
        in: query
        items:
          type: string
        name: ids
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
